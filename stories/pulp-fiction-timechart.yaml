# A film's two-clock chart: as screened vs as it happened.
#
# Schema: schema/timechart.schema.json   (enforced — run: python3 scripts/stories_yaml.py validate)
# yaml-language-server: $schema=schema/timechart.schema.json
#
# Editing notes:
#   cap      exactly two caption lines per beat; anything past ~47 characters
#            is word-wrapped at render time, so keep them short and factual
#   clusters who stands together, left to right. Every character present in the
#            beat must appear in exactly one cluster; anyone absent is drawn
#            off-page (hatched) automatically
#   stubs    a final exit, and it must sit on that character's LAST PRESENT beat
#   cats     which rubric category the beat's shape belongs to — this is a
#            description, NOT points owed (the film's score is the verdict)
#   order    lane stacking order; label size follows `width` instead
slug: pulp-fiction
title: Pulp Fiction
year: 1994
runtime_min: 154
sub: Nine scenes. The left spine is the order the film screens them; the right spine is the order they happen to
  the people in them.
notes:
- Where a ribbon runs straight, the story is telling itself in order. Where it crosses, the film cut time.
- 'Chronology is the standard reading of the film: the diner robbery that opens it is the last thing that happens.'
legend_note: 'Node numbering: left spine = screening position, right spine = real order. The gap between the two
  numbers is the edit.'
