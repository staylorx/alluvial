<text x="320" y="614.5" font-size="15" font-weight="700" text-anchor="end" fill="#1b57c4">Connell</text>
<text x="320" y="453.5" font-size="15" font-weight="700" text-anchor="end" fill="#d0316a">Marianne</text>
<text x="320" y="254.0" font-size="15" font-weight="700" text-anchor="end" fill="#6f8f96">Rob</text>
<text x="320" y="354.0" font-size="15" font-weight="700" text-anchor="end" fill="#b09a4e">Peggy</text>
<text x="320" y="483.5" font-size="15" font-weight="700" text-anchor="end" fill="#9c6552">Jamie</text>
<text x="320" y="643.5" font-size="15" font-weight="700" text-anchor="end" fill="#6e9078">Helen</text>
<text x="320" y="814.0" font-size="15" font-weight="700" text-anchor="end" fill="#7d8f52">Lorraine</text>
<text x="320" y="924.0" font-size="15" font-weight="700" text-anchor="end" fill="#7f4a4a">Alan</text>
<text x="320" y="1034.0" font-size="15" font-weight="700" text-anchor="end" fill="#b0a89e">Denise</text>
<text x="2530" y="354.0" font-size="14" font-weight="700" fill="#b09a4e">Peggy, Joanna & the Trinity circle</text>
<text x="2530" y="484.0" font-size="14" font-weight="700" fill="#1b57c4">Connell → a year in New York</text>
<text x="2530" y="734.0" font-size="14" font-weight="700" fill="#d0316a">Marianne stays — “I’ll always be here”</text>
