<svg xmlns="http://www.w3.org/2000/svg" width="2840" height="1420" viewBox="0 0 2840 1420" font-family="Helvetica, Arial, sans-serif">
<defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#d8d2c8"/></pattern></defs>
<rect width="2840" height="1420" fill="#faf7f2"/>
<rect x="0" y="140" width="2840" height="1010" fill="url(#dots)" opacity="0.55"/>
<text x="46" y="207" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#b3aa9d">THE SOCIAL WORLD</text>
<text x="46" y="1120" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#b3aa9d">FAMILY / THE PRIVATE</text>
<line x1="340" y1="152" x2="340" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="340" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 7</text>
<text x="340" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Sligo / Dublin</text>
<text x="340" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Summer apart: Jamie for</text>
<text x="340" y="117" font-size="12.5" font-style="italic" fill="#7d7568">her, Helen for him</text>
<line x1="680" y1="152" x2="680" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="680" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 8</text>
<text x="680" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Italy</text>
<text x="680" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Jamie's grip tightens;</text>
<text x="680" y="117" font-size="12.5" font-style="italic" fill="#7d7568">she chooses Connell anyway</text>
<line x1="1020" y1="152" x2="1020" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="1020" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 9</text>
<text x="1020" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Luleå, Sweden / Dublin</text>
<text x="1020" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Sweden — Lukas;</text>
<text x="1020" y="117" font-size="12.5" font-style="italic" fill="#7d7568">Connell calls too often</text>
<line x1="1360" y1="152" x2="1360" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="1360" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 10</text>
<text x="1360" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Sligo & Dublin</text>
<text x="1360" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Rob dies; Connell</text>
<text x="1360" y="117" font-size="12.5" font-style="italic" fill="#7d7568">starts therapy</text>
<text x="1360" y="144" font-size="12.5" font-weight="700" fill="#9c3b34">▸ 31 December, alone</text>
<line x1="1700" y1="152" x2="1700" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="1700" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 11</text>
<text x="1700" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Sligo</text>
<text x="1700" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Home again — she asks</text>
<text x="1700" y="117" font-size="12.5" font-style="italic" fill="#7d7568">him to hurt her</text>
<text x="1700" y="144" font-size="12.5" font-weight="700" fill="#9c3b34">▸ then Alan breaks her nose</text>
<line x1="2040" y1="152" x2="2040" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="2040" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 12</text>
<text x="2040" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Sligo & Dublin</text>
<text x="2040" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Christmas with the Waldrons;</text>
<text x="2040" y="117" font-size="12.5" font-style="italic" fill="#7d7568">New York is offered</text>
<line x1="2380" y1="152" x2="2380" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="2380" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">CODA</text>
<text x="2380" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Dublin → New York</text>
<text x="2380" y="100" font-size="12.5" font-style="italic" fill="#7d7568">He goes. She stays.</text>
<text x="2380" y="117" font-size="12.5" font-style="italic" fill="#7d7568">The braid never resolves</text>
