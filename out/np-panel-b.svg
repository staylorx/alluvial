<text x="1244.0" y="240.0" font-size="13.5" font-weight="700" fill="#6f8f96">Rob Hegarty takes his own life</text>
<text x="1244.0" y="257.0" font-size="12.5" font-style="italic" fill="#8b8377">New Year’s Eve — the strand ends</text>
