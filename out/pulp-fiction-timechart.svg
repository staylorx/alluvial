<text x="56" y="92" font-size="31" font-weight="700" fill="#22201d">Pulp Fiction — two clocks</text>
<text x="56" y="126" font-size="15.5" fill="#4a453f">Nine scenes. The left spine is the order the film screens them; the right spine is the order they happen to the people in them.</text>
<text x="56" y="158" font-size="14.5" fill="#7d7568">Where a ribbon runs straight, the story is telling itself in order. Where it crosses, the film cut time.</text>
<text x="56" y="182" font-size="14.5" fill="#7d7568">Chronology is the standard reading of the film: the diner robbery that opens it is the last thing that happens.</text>
