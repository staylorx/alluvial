<text x="46" y="207" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#b3aa9d">THE SOCIAL WORLD</text>
<text x="46" y="1120" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#b3aa9d">FAMILY / THE PRIVATE</text>
<line x1="330" y1="152" x2="330" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="330" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 1</text>
<text x="330" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Carricklea, Co. Sligo</text>
<text x="330" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Final year of school,</text>
<text x="330" y="117" font-size="12.5" font-style="italic" fill="#7d7568">and the secret starts</text>
<line x1="700" y1="152" x2="700" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="700" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 2</text>
<text x="700" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Carricklea</text>
<text x="700" y="100" font-size="12.5" font-style="italic" fill="#7d7568">The affair deepens;</text>
<text x="700" y="117" font-size="12.5" font-style="italic" fill="#7d7568">he won't say it aloud</text>
<line x1="1070" y1="152" x2="1070" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="1070" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 3</text>
<text x="1070" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">The Debs</text>
<text x="1070" y="100" font-size="12.5" font-style="italic" fill="#7d7568">He takes Rachel</text>
<text x="1070" y="117" font-size="12.5" font-style="italic" fill="#7d7568">to the Debs, not her</text>
<text x="1070" y="144" font-size="12.5" font-weight="700" fill="#9c3b34">▸ assaulted at the fundraiser</text>
<line x1="1440" y1="152" x2="1440" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="1440" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 4</text>
<text x="1440" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Dublin</text>
<text x="1440" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Trinity, months later:</text>
<text x="1440" y="117" font-size="12.5" font-style="italic" fill="#7d7568">she has friends, he has rent</text>
<line x1="1810" y1="152" x2="1810" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="1810" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 5</text>
<text x="1810" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Dublin</text>
<text x="1810" y="100" font-size="12.5" font-style="italic" fill="#7d7568">Friends again — Gareth out,</text>
<text x="1810" y="117" font-size="12.5" font-style="italic" fill="#7d7568">Jamie circling</text>
<line x1="2180" y1="152" x2="2180" y2="1150" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="2 5"/>
<text x="2180" y="58" font-size="16.5" font-weight="700" fill="#2b2622" letter-spacing="1.4">EPISODE 6</text>
<text x="2180" y="78" font-size="12.5" fill="#9a9086" letter-spacing="0.3">Dublin → Sligo</text>
<text x="2180" y="100" font-size="12.5" font-style="italic" fill="#7d7568">The best of it — then</text>
<text x="2180" y="117" font-size="12.5" font-style="italic" fill="#7d7568">Sligo, then money</text>
<text x="2180" y="144" font-size="12.5" font-weight="700" fill="#9c3b34">▸ her brother, at home</text>
