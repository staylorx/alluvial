<text x="690.0" y="288.0" font-size="21" font-weight="700" fill="#2b2622" letter-spacing="1.2">EPISODE 1</text>
<text x="690.0" y="316.0" font-size="17" fill="#9a9086" letter-spacing="0.2">Carricklea, Co. Sligo</text>
<text x="690.0" y="346.0" font-size="17" font-style="italic" fill="#7d7568">Final year of school,</text>
<text x="690.0" y="371.0" font-size="17" font-style="italic" fill="#7d7568">and the secret starts</text>
<text x="690.0" y="483.0" font-size="21" font-weight="700" fill="#2b2622" letter-spacing="1.2">EPISODE 2</text>
<text x="690.0" y="511.0" font-size="17" fill="#9a9086" letter-spacing="0.2">Carricklea</text>
<text x="690.0" y="541.0" font-size="17" font-style="italic" fill="#7d7568">The affair deepens;</text>
<text x="690.0" y="566.0" font-size="17" font-style="italic" fill="#7d7568">he won't say it aloud</text>
<text x="690.0" y="678.0" font-size="21" font-weight="700" fill="#2b2622" letter-spacing="1.2">EPISODE 3</text>
<text x="690.0" y="706.0" font-size="17" fill="#9a9086" letter-spacing="0.2">The Debs</text>
<text x="690.0" y="736.0" font-size="17" font-style="italic" fill="#7d7568">He takes Rachel</text>
<text x="690.0" y="761.0" font-size="17" font-style="italic" fill="#7d7568">to the Debs, not her</text>
<text x="690.0" y="794.0" font-size="17" font-weight="700" fill="#9c3b34">▸ assaulted at the fundraiser</text>
<text x="690.0" y="873.0" font-size="21" font-weight="700" fill="#2b2622" letter-spacing="1.2">EPISODE 4</text>
<text x="690.0" y="901.0" font-size="17" fill="#9a9086" letter-spacing="0.2">Dublin</text>
<text x="690.0" y="931.0" font-size="17" font-style="italic" fill="#7d7568">Trinity, months later:</text>
<text x="690.0" y="956.0" font-size="17" font-style="italic" fill="#7d7568">she has friends, he has rent</text>
<text x="690.0" y="1068.0" font-size="21" font-weight="700" fill="#2b2622" letter-spacing="1.2">EPISODE 5</text>
<text x="690.0" y="1096.0" font-size="17" fill="#9a9086" letter-spacing="0.2">Dublin</text>
<text x="690.0" y="1126.0" font-size="17" font-style="italic" fill="#7d7568">Friends again — Gareth out,</text>
<text x="690.0" y="1151.0" font-size="17" font-style="italic" fill="#7d7568">Jamie circling</text>
<text x="690.0" y="1263.0" font-size="21" font-weight="700" fill="#2b2622" letter-spacing="1.2">EPISODE 6</text>
<text x="690.0" y="1291.0" font-size="17" fill="#9a9086" letter-spacing="0.2">Dublin → Sligo</text>
<text x="690.0" y="1321.0" font-size="17" font-style="italic" fill="#7d7568">The best of it — then</text>
<text x="690.0" y="1346.0" font-size="17" font-style="italic" fill="#7d7568">Sligo, then money</text>
<text x="690.0" y="1379.0" font-size="17" font-weight="700" fill="#9c3b34">▸ her brother, at home</text>
