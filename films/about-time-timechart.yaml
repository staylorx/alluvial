# A film's two-clock chart: as screened vs as it happened.
#
# Schema: schema/timechart.schema.json   (enforced — run: python3 scripts/films_yaml.py validate)
# yaml-language-server: $schema=schema/timechart.schema.json
#
# Editing notes:
#   cap      exactly two caption lines per beat; anything past ~47 characters
#            is word-wrapped at render time, so keep them short and factual
#   clusters who stands together, left to right. Every character present in the
#            beat must appear in exactly one cluster; anyone absent is drawn
#            off-page (hatched) automatically
#   stubs    a final exit, and it must sit on that character's LAST PRESENT beat
#   cats     which rubric category the beat's shape belongs to — this is a
#            description, NOT points owed (the film's score is the verdict)
#   order    lane stacking order; label size follows `width` instead
slug: about-time
title: About Time
year: 2013
runtime_min: 123
sub: Fourteen scenes. The left spine is the order the film screens them; the right spine is when the nights he re-lives
  really happened.
notes:
- 'Tim''s rewinds are local, not a shuffle: the film tells his life straight, and the crossings are the nights he
  goes back into. Where a ribbon runs flat, the film is running in order.'
- 'REPEATED TIME: a night he lives twice gets ONE node on the right spine, at the slot where it happened. New Year''s
  Eve is screened twice (the timid first pass, then the replay he kisses through) and charted once, because the
  night happened once.'
- 'ERASED TIME: the Dans le Noir meeting and the rescue of Harry''s play are the same night lived twice. The rewind
  erases the restaurant and with it Mary''s number, but he lived that evening, so it keeps a slot - placed just
  before the play, which is the order he lived them - and the pair is charted as two nodes because two different
  things happened in the two versions.'
- 'VISITED PAST: the childhood beach day and the last table-tennis visit are placed where they sit in the world''s
  calendar (childhood; just before Dad dies), not where Tim stands when he travels. That is what makes those ribbons
  cross the whole chart.'
- 'Chronology is a judgement: the film gives no chapter cards, so acts are assigned by geography (Cornwall / London
  / married life) and the exact act lines are arguable.'
- Everything here is what the film shows. Nothing is invented to make a crossing.
legend_note: 'Node numbering: left spine = screening position, right spine = real order. The gap between the two
  numbers is the edit.'
