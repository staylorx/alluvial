name: alluvial_cli
description: The alluvial CLI — a binary that reads a folder of stories.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  alluvial_domain:      # Proprietary
    path: ../alluvial_domain
  alluvial_render:      # Proprietary
    path: ../alluvial_render
  alluvial_store_yaml:  # Proprietary
    path: ../alluvial_store_yaml
  alluvial_usecases:    # Proprietary
    path: ../alluvial_usecases
  args: ^2.6.0          # BSD-3-Clause
  fpdart: ^1.2.0        # MIT

dev_dependencies:
  alluvial_testing:   # Proprietary
    path: ../alluvial_testing
  lints: ^6.0.0       # BSD-3-Clause
  shouldly: ^0.5.0+1  # MIT
  test: ^1.25.0       # BSD-3-Clause
