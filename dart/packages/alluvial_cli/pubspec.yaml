name: alluvial_cli
description: The alluvial CLI — a binary that reads a folder of stories.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  alluvial_domain:
    path: ../alluvial_domain
  alluvial_store_yaml:
    path: ../alluvial_store_yaml
  alluvial_usecases:
    path: ../alluvial_usecases
  args: ^2.6.0
  fpdart: ^1.2.0

dev_dependencies:
  alluvial_testing:
    path: ../alluvial_testing
  lints: ^6.0.0
  shouldly: ^0.5.0+1
  test: ^1.25.0
